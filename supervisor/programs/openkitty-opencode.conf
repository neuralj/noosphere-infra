[program:openkitty-opencode]
command=/opt/homebrew/bin/opencode serve --port 4097 --hostname 127.0.0.1
directory=/Users/travis/Developer/repos/neuralj/openkitty
environment=PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
autostart=true
autorestart=true
stdout_logfile=%(ENV_REPO_ROOT)s/logs/openkitty-opencode.log
stderr_logfile=%(ENV_REPO_ROOT)s/logs/openkitty-opencode.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
