[program:openlaputa-panel]
command=/opt/homebrew/bin/node build/index.js
directory=%(ENV_REPO_ROOT)s/panel
environment=PORT="3000",HOST="127.0.0.1",NODE_ENV="production",PACK_KEEP_MAX="30",ALLOWED_PACK_DIRS="%(ENV_REPO_ROOT)s/../opensheeta,%(ENV_REPO_ROOT)s/../a-bulletin,%(ENV_REPO_ROOT)s/../a-market"
autostart=true
autorestart=true
stdout_logfile=%(ENV_REPO_ROOT)s/logs/openlaputa-panel.log
stderr_logfile=%(ENV_REPO_ROOT)s/logs/openlaputa-panel.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
