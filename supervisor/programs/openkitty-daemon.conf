[program:openkitty-daemon]
command=/opt/homebrew/bin/node dist/server/index.js
directory=/Users/travis/Developer/repos/neuralj/openkitty
environment=PORT="3101",HOST="127.0.0.1",NODE_ENV="production",OPENHUB_SERVER_URL="http://localhost:4097",OPENHUB_DB_PATH="data/openhub.json",PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
autostart=true
autorestart=true
stdout_logfile=%(ENV_REPO_ROOT)s/logs/openkitty-daemon.log
stderr_logfile=%(ENV_REPO_ROOT)s/logs/openkitty-daemon.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
