name: Build images

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  CI: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      images: ${{ steps.filter.outputs.changes }}
      base-images: ${{ steps.categorize.outputs.base }}
      dependent-images: ${{ steps.categorize.outputs.dependent }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            devshell:
              - 'images/devshell/**'
            postgres:
              - 'images/postgres/**'
            webtest:
              - 'images/webtest/**'
            ollama:
              - 'images/ollama/**'
            mineru:
              - 'images/mineru/**'
            mongodb:
              - 'images/mongodb/**'
            grafana:
              - 'images/grafana/**'
            qdrant:
              - 'images/qdrant/**'
            a-bulletin:
              - 'images/a-bulletin/**'
            a-market:
              - 'images/a-market/**'
            opensheeta:
              - 'images/opensheeta/**'
      - name: Categorize images
        id: categorize
        run: |
          IMAGES='${{ steps.filter.outputs.changes }}'
          # Images that depend on devshell
          DEPENDENT='["a-bulletin","a-market"]'
          # Base images (everything else)
          BASE=$(echo "$IMAGES" | jq -c '[.[] | select(. != "a-bulletin" and . != "a-market")]')
          # Dependent images that actually changed
          DEP_CHANGED=$(echo "$IMAGES" | jq -c '[.[] | select(. == "a-bulletin" or . == "a-market")]')

          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "dependent=$DEP_CHANGED" >> $GITHUB_OUTPUT
          echo "Base images: $BASE"
          echo "Dependent images: $DEP_CHANGED"

  build-base:
    needs: changes
    if: ${{ needs.changes.outputs.base-images != '[]' && needs.changes.outputs.base-images != '' }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.base-images) }}
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image }} (${{ matrix.arch }})
        uses: docker/build-push-action@v5
        with:
          context: ./images/${{ matrix.image }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest-${{ matrix.arch }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge-base:
    needs: [build-base, changes]
    if: ${{ needs.changes.outputs.base-images != '[]' && needs.changes.outputs.base-images != '' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Create and push multi-arch manifests (base)
        run: |
          SHA="${{ github.sha }}"
          SHA_SHORT="${SHA:0:7}"
          CHANGED='${{ needs.changes.outputs.base-images }}'

          for img in $(echo "$CHANGED" | jq -r '.[]'); do
            case "$img" in
              postgres) VERSION_TAG="17" ;;
              *) VERSION_TAG="latest" ;;
            esac

            docker buildx imagetools create -t \
              "ghcr.io/${{ github.repository_owner }}/${img}:${VERSION_TAG}" \
              "ghcr.io/${{ github.repository_owner }}/${img}:latest-amd64" \
              "ghcr.io/${{ github.repository_owner }}/${img}:latest-arm64"

            docker buildx imagetools create -t \
              "ghcr.io/${{ github.repository_owner }}/${img}:${SHA_SHORT}" \
              "ghcr.io/${{ github.repository_owner }}/${img}:${SHA}-amd64" \
              "ghcr.io/${{ github.repository_owner }}/${img}:${SHA}-arm64"
          done

  build-dependent:
    needs: [merge-base, changes]
    if: ${{ always() && needs.changes.outputs.dependent-images != '[]' && needs.changes.outputs.dependent-images != '' && (needs.merge-base.result == 'success' || needs.merge-base.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.dependent-images) }}
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image }} (${{ matrix.arch }})
        uses: docker/build-push-action@v5
        with:
          context: ./images/${{ matrix.image }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest-${{ matrix.arch }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge-dependent:
    needs: [build-dependent, changes]
    if: ${{ needs.changes.outputs.dependent-images != '[]' && needs.changes.outputs.dependent-images != '' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Create and push multi-arch manifests (dependent)
        run: |
          SHA="${{ github.sha }}"
          SHA_SHORT="${SHA:0:7}"
          CHANGED='${{ needs.changes.outputs.dependent-images }}'

          for img in $(echo "$CHANGED" | jq -r '.[]'); do
            docker buildx imagetools create -t \
              "ghcr.io/${{ github.repository_owner }}/${img}:latest" \
              "ghcr.io/${{ github.repository_owner }}/${img}:latest-amd64" \
              "ghcr.io/${{ github.repository_owner }}/${img}:latest-arm64"

            docker buildx imagetools create -t \
              "ghcr.io/${{ github.repository_owner }}/${img}:${SHA_SHORT}" \
              "ghcr.io/${{ github.repository_owner }}/${img}:${SHA}-amd64" \
              "ghcr.io/${{ github.repository_owner }}/${img}:${SHA}-arm64"
          done
