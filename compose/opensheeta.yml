services:
  opensheeta:
    image: ghcr.io/neuralj/opensheeta:latest
    container_name: opensheeta
    restart: unless-stopped
    ports:
      - "8765:8765"  # REST API
      - "8766:8766"  # WebSocket
      - "4096:4096"  # OpenCode server (if running)
    environment:
      - OS_STANDALONE=false
      - OS_PORT=8765
      - OC_PORT=4096
      - OS_LOG_LEVEL=info
      - TZ=Asia/Shanghai
    volumes:
      - opensheeta-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Standalone mode (for testing without OpenCode)
  opensheeta-standalone:
    image: ghcr.io/neuralj/opensheeta:latest
    container_name: opensheeta-standalone
    restart: unless-stopped
    ports:
      - "8775:8765"  # REST API
      - "8776:8766"  # WebSocket
    environment:
      - OS_STANDALONE=true
      - OS_PORT=8765
      - OS_LOG_LEVEL=info
      - TZ=Asia/Shanghai
    volumes:
      - opensheeta-standalone-data:/data
    profiles:
      - standalone
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  opensheeta-data:
  opensheeta-standalone-data:
